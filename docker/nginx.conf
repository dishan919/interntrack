worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    # Do not record query strings (verification/reset links) or auth headers.
    log_format safe '$remote_addr $request_method $uri $status';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        # Keep redirects relative: preserve the browser's actual host/port.
        absolute_redirect off;
        add_header X-Content-Type-Options nosniff always;

        location = / { return 302 /interntrack/; }
        location = /interntrack { return 308 /interntrack/; }

        location /interntrack/assets/ {
            try_files $uri =404;
        }
        location /interntrack/ {
            try_files $uri $uri/ /interntrack/index.html;
        }

        location /api/ {
            # Allow multipart overhead; Express still enforces the 2 MB photo limit.
            client_max_body_size 3m;
            # Docker DNS + variable upstream survives backend IP changes on recreate.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api_upstream http://backend:5000;
            proxy_pass $api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # Missing API routes/assets must never become HTML SPA responses.
        location / { return 404; }
    }
}
